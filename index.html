<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새싹 왕국 디펜스 — 초원 왕국</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <header id="top">
    <div class="brand"><span class="crest" aria-hidden="true">🌱</span><h1>새싹 왕국 디펜스 <small id="heroTag" title="Stage 1 · 초원 왕국">초원 왕국</small></h1></div>
    <div class="stats" aria-label="전투 상태">
      <span class="stat gold" title="골드"><i>●</i><b id="gold">0</b></span>
      <span class="stat lives" title="왕국 방어력"><i>♥</i><b id="lives">0</b></span>
      <span class="stat wave" title="웨이브"><i>⚑</i><b id="wave">0</b></span>
      <button id="speedBtn" class="roundBtn" type="button" aria-label="게임 속도">×1</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="game" aria-label="디펜스 전장"></canvas>
    <div id="toast" role="status"></div>
    <div id="waveIntro" hidden><strong id="waveIntroTitle"></strong><span id="waveIntroText"></span></div>
    <div id="bossHud" hidden><span id="bossName">오우거 군주</span><div><i id="bossFill"></i></div></div>
    <div id="panel" hidden>
      <div id="pName"></div><div id="pInfo"></div>
      <div class="prow"><button id="upBtn" type="button"></button><button id="sellBtn" type="button"></button></div>
      <div class="prow"><button id="targetBtn" type="button">공격 우선: 선두</button></div>
    </div>
    <div id="end" hidden><div><h2 id="endTitle"></h2><p id="endText"></p><button id="retry" type="button">다시 하기</button></div></div>
  </div>

  <footer id="bar" aria-label="전투 메뉴"><div class="barTitle">TOWER DEFENSE</div>
    <div class="group" id="towers">
      <button class="tbtn" data-t="ballista" type="button"><img alt=""><span>궁수 타워<em>60</em></span></button>
      <button class="tbtn" data-t="mortar" type="button"><img alt=""><span>포병 타워<em>90</em></span></button>
      <button class="tbtn" data-t="vine" type="button"><img alt=""><span>마법 타워<em>70</em></span></button>
      <button class="tbtn" data-t="wall" type="button"><img alt=""><span>병영<em>45</em></span></button>
    </div>
    <div class="group" id="skills">
      <button id="sk_burst" class="sk" type="button"><span>화살비</span><kbd>Q</kbd><i class="cdv"></i></button>
      <button id="sk_root" class="sk" type="button"><span>왕국의 결계</span><kbd>W</kbd><i class="cdv"></i></button>
      <button id="sk_bloom" class="sk" type="button"><span>긴급 지원</span><kbd>E</kbd><i class="cdv"></i></button>
    </div>
    <div id="wavePrep"><small>다음 웨이브</small><strong id="nextWave">준비 중</strong></div>
    <button id="startBtn" type="button">전투 시작</button>
  </footer>
  <p id="help">타워 선택 → 설치대 클릭 · 설치된 타워를 눌러 강화/판매 · 스페이스: 웨이브 시작 · 지휘관 오라 안의 타워는 공격력 +25%</p>
</main>
<script src="js/glbview.js"></script>
<script src="js/game.js"></script>
</body>
</html>
