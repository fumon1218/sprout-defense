name: Import Library Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-library-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          ref: feat/grassland-stage1
          fetch-depth: 0

      - name: Extract categorized Library assets
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/import/library-assets-pack.tar.gz
          tar -xzf assets/import/library-assets-pack.tar.gz -C .
          rm -f assets/import/library-assets-pack.tar.gz
          COUNT=$(find assets/library -type f -name '*.webp' | wc -l | tr -d ' ')
          echo "Imported image count: $COUNT"
          test "$COUNT" -eq 144

      - name: Commit extracted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/library\n          git add -A assets/import
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "assets: import 144 categorized Library images"
            git push origin HEAD:feat/grassland-stage1
          fi
